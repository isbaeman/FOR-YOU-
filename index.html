<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>For you</title>

<!-- Premium typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<!-- Urdu font for the final sequence -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050505;--ink:#ece6dc;--dim:#8c857b;--beige:#c9b8a0;--red:#8a2f35;--gold:#b79d6b;
    --serif:'Bodoni Moda',Georgia,serif;
    --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--beige);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#glow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(60% 50% at 50% 55%,rgba(138,47,53,.24),transparent 70%)}
#glow.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.85}}
#grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.07;animation:grain 1s steps(6) infinite;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.scene{position:fixed;inset:0;z-index:2;display:flex;padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;text-align:center;opacity:0;visibility:hidden;transition:opacity 1.6s ease,visibility 0s 1.6s}
.scene.on{opacity:1;visibility:visible;transition:opacity 1.6s ease}
.wrap{margin:auto;width:100%;max-width:680px;padding:24px 0}
.wrap.narrow{max-width:540px}
.stage{position:absolute;inset:0}
.fd{opacity:0;transition:opacity .9s ease}
.fd.in{opacity:1}
.line{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5.4vw,54px);line-height:1.25;letter-spacing:.01em;min-height:1.3em;opacity:0;filter:blur(10px);transition:opacity 1.8s ease,filter 1.8s ease}
.line.in{opacity:1;filter:blur(0)}
.line.low{position:absolute;left:22px;right:22px;top:62%;font-size:clamp(22px,4.4vw,40px)}
.tl{opacity:1;filter:none;transition:opacity 2.6s,filter 2.6s,letter-spacing 2.6s}
.tl.gone{opacity:0;filter:blur(14px);letter-spacing:.07em}
.ch{opacity:0;filter:blur(6px);transition:opacity 1s,filter 1s}
.ch.on{opacity:1;filter:none}
.ttl{font-family:var(--serif);font-weight:500;font-size:clamp(30px,6vw,56px);line-height:1.15}
.sub{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(18px,3vw,26px);color:var(--beige);margin:14px 0 28px}
.btn{display:inline-block;min-height:48px;padding:0 34px;background:transparent;border:1px solid rgba(201,184,160,.5);color:var(--ink);font:400 12px var(--sans);letter-spacing:.32em;cursor:pointer;transition:background .5s,border-color .5s,letter-spacing .5s}
.btn.ghost{border-color:transparent;color:var(--dim);letter-spacing:.2em;margin-top:26px}
@media (hover:hover){.btn:hover{background:rgba(201,184,160,.1);border-color:var(--beige)}.btn.ghost:hover{color:var(--ink)}}

/* PASSWORD */
#pw{margin-top:34px}
#pwi{display:block;width:100%;max-width:300px;height:52px;margin:0 auto 18px;background:transparent;border:0;border-bottom:1px solid rgba(201,184,160,.45);text-align:center;font:400 22px var(--serif);letter-spacing:.2em;outline:0;transition:border-color .5s}
#pwi:focus{border-color:var(--beige)}
#pwi::placeholder{color:#59544d;letter-spacing:.15em;font-size:18px}
#pwi.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.err{height:24px;margin-top:16px;font:italic 400 17px var(--serif);color:#b3636a;opacity:0;transition:opacity .6s}
.err.in{opacity:1}

/* LONG DISTANCE */
.pt{position:absolute;top:42%;transform:translate(-50%,-50%);opacity:0;transition:opacity 3s;display:flex;flex-direction:column;align-items:center;gap:18px}
.pt.L{left:10%}.pt.R{left:90%}.pt.v{opacity:1}
.pt i{width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 18px 4px rgba(236,230,220,.3);animation:br 5s ease-in-out infinite}
.pt.R i{animation-delay:-2.5s}
.pt span{position:absolute;top:22px;font:300 11px var(--sans);letter-spacing:.35em;color:var(--dim)}
@keyframes br{50%{transform:scale(1.5);opacity:.65}}
.link{position:absolute;top:42%;left:10%;right:10%;height:1px}
.link b{display:block;height:1px;width:100%;background:linear-gradient(90deg,rgba(236,230,220,.5),rgba(236,230,220,.18));transform:scaleX(0);transform-origin:left;transition:transform 9s cubic-bezier(.4,0,.2,1)}
.link.go b{transform:scaleX(1)}

/* QUIZ */
.qtop{display:flex;align-items:center;gap:16px;margin-bottom:34px;font:300 13px var(--sans);letter-spacing:.2em;color:var(--beige)}
.pbar{flex:1;height:1px;background:rgba(236,230,220,.14)}
.pbar i{display:block;height:1px;width:0;background:var(--beige);transition:width 1s}
.qt{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5vw,40px);line-height:1.25;margin-bottom:30px;text-align:left}
.opt{display:flex;gap:16px;align-items:center;width:100%;min-height:58px;padding:14px 18px;margin-bottom:12px;background:rgba(236,230,220,.03);border:1px solid rgba(236,230,220,.14);border-radius:2px;text-align:left;font:300 16px/1.35 var(--sans);cursor:pointer;transition:border-color .5s,background .5s,transform .5s;animation:rise .8s both}
.opt em{font:italic 400 22px var(--serif);color:var(--beige);width:20px;flex:none}
@media (hover:hover){.opt:hover{border-color:rgba(201,184,160,.55)}}
.opt.sel{border-color:var(--beige);background:rgba(201,184,160,.09);transform:scale(1.015)}
.opt.ok{border-color:rgba(183,157,107,.85);background:rgba(183,157,107,.11)}
.opt.no{border-color:rgba(138,47,53,.95);background:rgba(138,47,53,.2);animation:shake .45s}
.opt.lock{pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fbk{min-height:28px;margin-top:10px;font:italic 400 19px var(--serif);color:var(--beige);opacity:0;transition:opacity .6s}
.fbk.in{opacity:1}
.score{font:400 clamp(56px,14vw,110px) var(--serif);line-height:1}
.msg{font:italic 400 clamp(22px,4vw,32px)/1.35 var(--serif);color:var(--beige);margin:22px 0 40px}
#sx{font-size:clamp(22px,4.4vw,38px)}

/* MEMORIES */
.atmo{position:fixed;inset:0;z-index:-1}
.a{position:absolute;inset:-10%;opacity:0;transition:opacity 3.5s ease;animation:drift 26s ease-in-out infinite alternate}
.a.on{opacity:1}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2.5%,2%)}}
.a1{background:radial-gradient(40% 35% at 25% 60%,rgba(201,184,160,.16),transparent 70%),radial-gradient(30% 30% at 75% 35%,rgba(138,47,53,.12),transparent 70%)}
.a2{background:radial-gradient(1.5px 1.5px at 12% 22%,#ece6dc,transparent),radial-gradient(1px 1px at 30% 70%,#ece6dc,transparent),radial-gradient(2px 2px at 58% 18%,#ece6dc,transparent),radial-gradient(1px 1px at 76% 62%,#ece6dc,transparent),radial-gradient(1.5px 1.5px at 88% 30%,#ece6dc,transparent),radial-gradient(1px 1px at 45% 45%,#ece6dc,transparent),radial-gradient(50% 40% at 50% 100%,rgba(236,230,220,.07),transparent)}
.a3{background:radial-gradient(45% 30% at 50% 105%,rgba(138,47,53,.3),transparent 70%),radial-gradient(18% 18% at 80% 20%,rgba(236,230,220,.08),transparent 70%)}
.a4{background:radial-gradient(14% 14% at 20% 30%,rgba(183,157,107,.2),transparent 70%),radial-gradient(10% 10% at 70% 55%,rgba(236,230,220,.12),transparent 70%),radial-gradient(18% 18% at 45% 80%,rgba(201,184,160,.14),transparent 70%),radial-gradient(8% 8% at 85% 25%,rgba(138,47,53,.18),transparent 70%)}
.a5{background:radial-gradient(35% 45% at 50% 50%,rgba(201,184,160,.2),transparent 72%),radial-gradient(70% 70% at 50% 50%,rgba(138,47,53,.1),transparent 80%)}

/* SONGS */
.song{display:grid;grid-template-columns:28px 1fr 52px;gap:14px;align-items:center;padding:18px 0;border-top:1px solid rgba(236,230,220,.1);text-align:left}
.song:last-of-type{border-bottom:1px solid rgba(236,230,220,.1)}
.song .no{font:italic 300 24px var(--serif);color:var(--dim)}
.song.playing .no{color:var(--beige)}
.ttlrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stt{font:400 22px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:14px;opacity:.25;transition:opacity .6s}
.eq u{width:2px;height:100%;background:var(--beige);transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq u:nth-child(2){animation-delay:-.4s}
.eq u:nth-child(3){animation-delay:-.75s}
.song.playing .eq{opacity:1}
.song.playing .eq u{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.bar{position:relative;height:18px;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:rgba(236,230,220,.2)}
.bar i{position:absolute;left:0;top:7px;height:3px;width:0;background:var(--beige)}
.tm{display:flex;justify-content:space-between;font:300 11px var(--sans);letter-spacing:.1em;color:var(--dim);margin-top:4px}
.pp{width:52px;height:52px;border-radius:50%;border:1px solid rgba(201,184,160,.5);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .5s,border-color .5s}
.pp svg{width:18px;height:18px;fill:var(--ink)}
.pp .ip{display:none}
.pp.playing .ip{display:block}
.pp.playing .ia{display:none}
.pp.playing{border-color:var(--beige);background:rgba(201,184,160,.1)}
@media (hover:hover){.pp:hover{border-color:var(--beige)}}
.pp.big{width:64px;height:64px;flex:none}

/* LETTER */
#letter{margin:0 auto;max-width:560px;padding:clamp(28px,6vw,52px);text-align:left;color:#2b231c;background:linear-gradient(160deg,#d3c6af,#c4b59b);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(90,70,40,.18);transition:opacity 2.5s}
.lp{font:400 clamp(18px,3.2vw,22px)/1.7 var(--serif);margin-bottom:1.1em;animation:rise 1.6s both}
.lp.gr{font-size:clamp(22px,4vw,28px);font-style:italic}
.lp.sg{font-style:italic;font-size:clamp(20px,3.6vw,26px);margin-top:1.6em}

/* SURPRISES */
.dot{position:absolute;left:24%;top:30%;width:44px;height:44px;border:0;background:transparent;cursor:pointer;transition:opacity 2s}
.dot::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--beige);box-shadow:0 0 14px 3px rgba(201,184,160,.55);animation:br 3.6s ease-in-out infinite}
.dot.found{opacity:0;pointer-events:none}
.ps{position:absolute;left:22px;right:22px;bottom:16%;font:italic 300 clamp(17px,3vw,22px) var(--serif);color:var(--beige);transition:opacity 3s}
.more{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);min-height:44px;padding:0 20px;border:0;background:transparent;font:italic 300 19px var(--serif);color:var(--dim);cursor:pointer;white-space:nowrap}
@media (hover:hover){.more:hover{color:var(--ink)}}

/* VOICE */
#vp{max-width:560px;margin:0 auto;transition:opacity 3.5s}
#wave{display:block;width:100%;height:96px;margin-bottom:26px}
.vrow{display:flex;gap:20px;align-items:center;text-align:left}
.vcol{flex:1;min-width:0}
.note{margin-top:34px;font:italic 300 21px var(--serif);color:var(--beige)}

/* FINAL */
.fin{transition:opacity 4s}
.fin.dim{opacity:.22}
.fl{margin:0 0 .5em;font-size:clamp(24px,5vw,44px)}
.fl.love{margin-top:.8em;font-size:clamp(34px,7vw,64px)}
.fl.sign{font-style:italic;font-size:clamp(20px,3.6vw,30px);color:var(--beige);margin-top:.8em}
body.end #fx{opacity:0;transition:opacity 6s}
body.end #grain,body.end #glow{opacity:0;transition:opacity 6s}
body.end .scene.on{opacity:0;transition:opacity 6s}

@media (max-width:420px){
    .song{grid-template-columns:22px 1fr 48px;gap:10px}
    .pp{width:48px;height:48px}
    .stt{font-size:20px}
    .btn{padding:0 26px}
}
@media (prefers-reduced-motion:reduce){#grain,.a,.pt i,.dot::after{animation:none}}

/* ===== PRETTY BUTTONS ===== */
.btn{position:relative;min-height:52px;padding:0 42px;border-radius:999px;border:1px solid rgba(201,184,160,.55);background:linear-gradient(135deg,rgba(201,184,160,.16),rgba(138,47,53,.22));box-shadow:0 0 26px rgba(138,47,53,.28),inset 0 1px 0 rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .5s,border-color .5s,letter-spacing .5s,box-shadow .5s,transform .3s}
.btn:active{transform:scale(.96)}
@media (hover:hover){.btn:hover{letter-spacing:.38em;transform:translateY(-2px);border-color:var(--beige);background:linear-gradient(135deg,rgba(201,184,160,.26),rgba(138,47,53,.34));box-shadow:0 8px 36px rgba(138,47,53,.45),0 0 18px rgba(201,184,160,.25),inset 0 1px 0 rgba(255,255,255,.16)}}
.btn.ghost{border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 6px;min-height:44px;color:var(--beige);letter-spacing:.26em}
.btn.ghost::after{content:"";position:absolute;left:50%;bottom:6px;width:28px;height:1px;background:var(--beige);transform:translateX(-50%);opacity:.6;transition:width .5s,opacity .5s}
@media (hover:hover){.btn.ghost:hover{transform:none;background:none;box-shadow:none;color:var(--ink);letter-spacing:.3em}.btn.ghost:hover::after{width:100%;opacity:1}}

.opt{border-radius:16px;padding:14px 20px;border:1px solid rgba(236,230,220,.16);background:linear-gradient(135deg,rgba(236,230,220,.06),rgba(236,230,220,.015));box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .5s,background .5s,transform .4s,box-shadow .5s}
.opt em{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,184,160,.4);background:rgba(201,184,160,.07);font-size:18px;transition:background .5s,border-color .5s,color .5s}
@media (hover:hover){.opt:hover{transform:translateY(-2px);border-color:rgba(201,184,160,.7);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 18px rgba(201,184,160,.12)}.opt:hover em{background:rgba(201,184,160,.18);border-color:var(--beige)}}
.opt.sel{transform:scale(1.02);border-color:var(--beige);box-shadow:0 0 24px rgba(201,184,160,.22)}
.opt.sel em{background:rgba(201,184,160,.3);border-color:var(--beige)}
.opt.ok{border-color:rgba(183,157,107,.9);box-shadow:0 0 26px rgba(183,157,107,.28)}
.opt.ok em{background:rgba(183,157,107,.35);border-color:var(--gold);color:var(--ink)}
.opt.no{border-color:rgba(138,47,53,.95);box-shadow:0 0 26px rgba(138,47,53,.35)}
.opt.no em{background:rgba(138,47,53,.45);border-color:#b3636a;color:var(--ink)}

.pp{background:rgba(201,184,160,.07);box-shadow:0 0 20px rgba(138,47,53,.22),inset 0 1px 0 rgba(255,255,255,.1);transition:background .5s,border-color .5s,box-shadow .5s,transform .3s}
.pp:active{transform:scale(.92)}
@media (hover:hover){.pp:hover{transform:scale(1.07);background:rgba(201,184,160,.16);box-shadow:0 0 28px rgba(201,184,160,.28)}}
.pp.playing{box-shadow:0 0 30px rgba(183,157,107,.35),inset 0 0 12px rgba(201,184,160,.15)}

.more{min-height:50px;padding:0 34px;border-radius:999px;border:1px solid rgba(201,184,160,.55);background:linear-gradient(135deg,rgba(201,184,160,.16),rgba(138,47,53,.22));box-shadow:0 0 26px rgba(138,47,53,.28),inset 0 1px 0 rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);letter-spacing:.04em;transition:color .5s,border-color .5s,background .5s,box-shadow .5s,opacity .9s ease}
.more:active{transform:translateX(-50%) scale(.96)}
@media (hover:hover){.more:hover{border-color:var(--beige);background:linear-gradient(135deg,rgba(201,184,160,.26),rgba(138,47,53,.34));box-shadow:0 8px 36px rgba(138,47,53,.45),0 0 18px rgba(201,184,160,.25),inset 0 1px 0 rgba(255,255,255,.16)}}

/* Italic text only */
html,body,.btn,#pwi,.qtop,.opt,.pt span,.score,.stt,.tm,.lp{font-style:italic}

/* ===== FINAL SEQUENCE (s11) ===== */
#s11 .fsStage{display:grid;place-items:center;min-height:50vh}
#s11 .fsStage>*{grid-area:1/1;max-width:100%}
#s11 .line{pointer-events:none}
#fsLyric{transition:opacity .7s ease,filter .7s ease}
#fsMsg{text-shadow:0 0 24px rgba(201,184,160,.3);font-size:clamp(24px,5vw,46px)}
#fsLyric{
    direction:rtl;
    font-style:normal;
    font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Scheherazade New',serif;
    font-size:clamp(22px,5vw,42px);
    line-height:2.1;
    text-shadow:0 0 22px rgba(201,184,160,.35);
    overflow-wrap:anywhere;
}
</style>
</head>

<body>

<!-- 1 PASSWORD -->
<section id="s1" class="scene on">
    <div class="wrap">
        <p class="line" id="t1"></p>
        <form id="pw" class="fd" style="display:none" autocomplete="off">
            <input id="pwi" type="password" placeholder="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password">
            <button type="submit" class="btn">UNLOCK</button>
            <p id="pwe" class="err" aria-live="polite"></p>
        </form>
    </div>
</section>

<!-- 2 LONG DISTANCE -->
<section id="s2" class="scene">
    <div class="stage">
        <div class="pt L"><i></i><span id="lblL"></span></div>
        <div class="pt R"><i></i><span id="lblR"></span></div>
        <div class="link"><b></b></div>
        <p class="line low" id="t2"></p>
    </div>
</section>

<!-- 3 QUIZ -->
<section id="s3" class="scene">
    <div class="wrap">
        <div id="qIntro" class="fd">
            <h2 class="ttl">How well do you really know me?</h2>
            <p class="sub">Let's find out.</p>
        </div>
        <div id="qBox" class="fd" style="display:none">
            <div class="qtop">
                <span id="qn"></span>
                <div class="pbar"><i id="pb"></i></div>
            </div>
            <h3 id="qt" class="qt"></h3>
            <div id="opts"></div>
            <p id="fb" class="fbk"></p>
        </div>
        <div id="qEnd" class="fd" style="display:none">
            <p class="score" id="sc"></p>
            <p class="msg" id="sm"></p>
            <p class="line" id="sx"></p>
        </div>
    </div>
</section>

<!-- 4 MESSAGES -->
<section id="s4" class="scene">
    <div class="wrap"><p class="line tl" id="t4"></p></div>
</section>

<!-- 5 MEMORIES -->
<section id="s5" class="scene">
    <div class="atmo">
        <div class="a a1"></div><div class="a a2"></div><div class="a a3"></div><div class="a a4"></div><div class="a a5"></div>
    </div>
    <div class="wrap"><p class="line" id="t5"></p></div>
</section>

<!-- 6 SONGS -->
<section id="s6" class="scene">
    <div class="wrap narrow">
        <h2 class="ttl">Four songs.</h2>
        <p class="sub">Maybe you'll understand why I chose them.</p>
        <div id="songs"></div>
        <button class="btn ghost" id="n6">Continue</button>
    </div>
</section>

<!-- 7 LETTER -->
<section id="s7" class="scene">
    <div class="wrap">
        <div id="openBox" class="fd in">
            <p class="line" id="t7"></p>
            <button class="btn fd" id="open" style="display:none">OPEN</button>
        </div>
        <div id="letter" class="fd" style="display:none"></div>
        <button class="btn ghost fd" id="n7" style="display:none">Continue</button>
    </div>
</section>

<!-- 8 SURPRISES -->
<section id="s8" class="scene">
    <div class="stage">

// ============================
// PARTICLES
// ============================
const cv = document.querySelector("#fx");
const cx = cv.getContext("2d");
const D = Math.min(window.devicePixelRatio || 1, 2);

const fx = { alpha: 0, ta: 0, speed: 1, sp: 1, heart: false, tint: "236,230,220" };

const P = [];
const HN = 60;
let W, H;

function heartPts() {
    const s = Math.min(W, H) / 52;
    for (let i = 0; i < HN; i++) {
        const t = i / HN * Math.PI * 2;
        P[i].tx = W / 2 + 16 * Math.pow(Math.sin(t), 3) * s;
        P[i].ty = H / 2 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s + s * 1.5;
    }
}

function size() {
    W = innerWidth;
    H = innerHeight;
    cv.width = W * D;
    cv.height = H * D;
    cx.setTransform(D, 0, 0, D, 0, 0);
    if (P.length) heartPts();
}

function seed() {
    const n = innerWidth < 600 ? 70 : 110;
    for (let i = 0; i < n; i++) {
        P.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - .5) * .18,
            vy: -.04 - Math.random() * .2,
            r: .4 + Math.random() * 1.3,
            a: .15 + Math.random() * .5,
            ph: Math.random() * 6.28,
            k: 1, tx: 0, ty: 0
        });
    }
    heartPts();
}

function frame(t) {
    fx.alpha += (fx.ta - fx.alpha) * .02;
    fx.speed += (fx.sp - fx.speed) * .02;
    cx.clearRect(0, 0, W, H);

    for (let i = 0; i < P.length; i++) {
        const p = P[i];
        const isH = fx.heart && i < HN;

        if (isH) {
            p.x += (p.tx - p.x) * .012;
            p.y += (p.ty - p.y) * .012 + Math.sin(t / 2200 + p.ph) * .04;
        } else {
            p.x += p.vx * fx.speed;
            p.y += p.vy * fx.speed;
            if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
            if (p.x < -5) p.x = W + 5;
            if (p.x > W + 5) p.x = -5;
            if (fx.heart) p.k *= .985;
        }

        const a = p.a * (.6 + .4 * Math.sin(t / 1500 + p.ph)) * fx.alpha * p.k * (isH ? 1.5 : 1);
        if (a < .004) continue;

        cx.fillStyle = "rgba(" + fx.tint + "," + Math.min(a, 1) + ")";
        cx.beginPath();
        cx.arc(p.x, p.y, isH ? 1.7 : p.r, 0, 6.283);
        cx.fill();
    }

    if (wvOn) drawWave(t);
    requestAnimationFrame(frame);
}

let qi = 0;
let score = 0;
let lock = false;

function renderQ() {
    const q = questions[qi];
    const o = document.querySelector("#opts");

    document.querySelector("#qn").textContent = pad(qi + 1) + " / " + pad(questions.length);
    document.querySelector("#qt").textContent = q.question;
    document.querySelector("#fb").classList.remove("in");
    o.innerHTML = "";
    document.querySelector("#pb").style.width = (qi / questions.length * 100) + "%";

    q.options.forEach((txt, k) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.style.animationDelay = (.15 + k * .1) + "s";
        b.innerHTML = "<em>" + "ABCD"[k] + ".</em><span></span>";
        b.lastChild.textContent = txt;
        b.onclick = () => pick(k, b);
        o.append(b);
    });
}

async function pick(k, btn) {
    if (lock) return;
    lock = true;

    const q = questions[qi];
    const bs = [...document.querySelector("#opts").children];

    bs.forEach(b => b.classList.add("lock"));
    btn.classList.add("sel");
    await sleep(500);

    const right = k === q.answer;
    if (right) score++;

    btn.classList.remove("sel");
    btn.classList.add(right ? "ok" : "no");
    if (!right) bs[q.answer].classList.add("ok");

    const fb = document.querySelector("#fb");
    fb.textContent = rnd(right ? FEEDBACK.correct : FEEDBACK.wrong);
    fb.classList.add("in");

    document.querySelector("#pb").style.width = ((qi + 1) / questions.length * 100) + "%";

    await sleep(1700);
    await hideEl(document.querySelector("#qBox"));

    if (++qi < questions.length) {
        renderQ();
        await showEl(document.querySelector("#qBox"));
        lock = false;
    } else {
        endQuiz();
    }
}

async function endQuiz() {
    document.querySelector("#sc").textContent = score + " / " + questions.length;
    document.querySelector("#sm").textContent = RESULTS.find(r => score >= r.min).text;

    await showEl(document.querySelector("#qEnd"));
    await sleep(4800);
    await say(document.querySelector("#sx"), "But that was only the beginning.", 1800);

    go("s4");
}

const audios = [];

function pauseAll(ex) {
    audios.forEach(a => { if (a !== ex) a.pause(); });
}

function bindPlayer(a, o) {
    a.addEventListener("loadedmetadata", () => o.dur.textContent = fmt(a.duration));

    a.addEventListener("timeupdate", () => {
        o.cur.textContent = fmt(a.currentTime);
        o.bar.firstElementChild.style.width = (a.currentTime / a.duration * 100 || 0) + "%";
    });

    a.addEventListener("play", () => {
        o.btn.classList.add("playing");
        o.box.classList.add("playing");
        if (o.onPlay) o.onPlay();
    });

    a.addEventListener("pause", () => {
        o.btn.classList.remove("playing");
        o.box.classList.remove("playing");
        if (o.onPause) o.onPause();
    });

    o.btn.onclick = () => {
        if (a.paused) {
            pauseAll(a);
            a.play().catch(() => {});
        } else {
            a.pause();
        }
    };

    const seek = e => {
        if (!isFinite(a.duration)) return;
        const r = o.bar.getBoundingClientRect();
        a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
    };

    let drag = false;

    o.bar.addEventListener("pointerdown", e => {
        drag = true;
        o.bar.setPointerCapture(e.pointerId);
        seek(e);
    });
    o.bar.addEventListener("pointermove", e => drag && seek(e));
    o.bar.addEventListener("pointerup", () => drag = false);
}

const wv = document.querySelector("#wave");
const wx = wv.getContext("2d");
const BARS = 56;

const base = Array.from({ length: BARS }, (_, i) =>
    .25 + .75 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .53))
);

let wvOn = false;
let voicePlaying = false;

const voice = new Audio(VOICE.src);
voice.preload = "metadata";

function drawWave(t) {
    const w = wv.clientWidth;
    const h = wv.clientHeight;

    if (!w) return;

    if (wv.width !== Math.round(w * D)) {
        wv.width = Math.round(w * D);
        wv.height = Math.round(h * D);
    }

    wx.setTransform(D, 0, 0, D, 0, 0);
    wx.clearRect(0, 0, w, h);

    const prog = voice.duration ? voice.currentTime / voice.duration : 0;
    const bw = w / BARS;

    for (let i = 0; i < BARS; i++) {
        const amp = voicePlaying ? .4 + .6 * Math.abs(Math.sin(t / 260 + i * .6)) : .2;
        const bh = Math.max(2, base[i] * amp * h * .92);

        wx.fillStyle = i / BARS < prog ? "rgba(236,230,220,.95)" : "rgba(236,230,220,.28)";
        wx.fillRect(i * bw + bw / 2 - 1, (h - bh) / 2, 2, bh);
    }
}

        document.querySelector("#glow").classList.add("pulse");
        fx.sp = 1.2;
    },

    onPause() {
        voicePlaying = false;
        document.querySelector("#glow").classList.remove("pulse");
        fx.sp = .7;
    }
});

voice.addEventListener("ended", async () => {
    voicePlaying = false;
    document.querySelector("#glow").classList.remove("pulse");

    fx.sp = .15;
    fx.ta = .15;

    document.querySelector("#vp").classList.remove("in");

    await sleep(4200);
    go("s10");
});

};

// ============================
// FINAL SEQUENCE
// ============================
const FINAL_MESSAGE = "This is exactly how my heart feels whenever someone asks me about you";

const FINAL_SONG = { src: "alfaz.mp3" };

const LYRIC_LINES = [
    "اُن کی تعریف میں کہیں کیا،",
    "الفاظ ہی نہیں ہیں۔",
    "جو کچھ میرا ہے، سب کچھ اُن کا،",
    "اُن سے زیادہ، قسم سے ہم کو،",
    "کوئی خاص ہی نہیں ہے۔",
    "خیال ہے بڑا اُن کا۔"
];

// [lineIndex, startSecond]. Poora lyrics do dafa: 1-6, phir dobara 1-6.
// Timing theek karni ho to sirf seconds badlo (ya ?sync se tap karke record karo).
const LYRIC_CUES = [
    [0, 1.0],  [1, 5.2],  [2, 9.2],  [3, 14.9], [4, 19.0], [5, 22.0],
    [0, 28.2], [1, 33.4], [2, 37.4], [3, 42.0], [4, 46.5], [5, 49.5]
];

const LYRIC_END = 56.8;  // second when the last line fades out

const SYNC_MODE = location.search.includes("sync");

const finalAudio = new Audio(FINAL_SONG.src);
finalAudio.preload = "auto";
audios.push(finalAudio);

RUN.s11 = async () => {
    // clear the heart from the previous scene
    fx.heart = false;
    fx.tint = "236,230,220";
    P.forEach(p => p.k = 1);

    const msg = $("#fsMsg");
    const btn = $("#fsStart");

    await sleep(1800);
    await typeLine(msg, FINAL_MESSAGE, 2600);
    await sleep(2200);

    await showEl(btn);
};

// clock: uses the song's time when it is really playing, otherwise a plain timer,
// so the lyrics still show even if the mp3 fails to load
let useTimer = false, t0 = 0;
const nowT = () => useTimer ? (performance.now() - t0) / 1000 : finalAudio.currentTime;
const waitFor = t => new Promise(res => {
    const tick = () => (nowT() >= t || (!useTimer && finalAudio.ended)) ? res() : requestAnimationFrame(tick);
    tick();
});

async function runSync(lyric) {
    const marks = [];
    lyric.style.direction = "ltr";
    lyric.style.fontFamily = "var(--serif)";
    lyric.textContent = "Tap anywhere exactly when each line starts (" + LYRIC_CUES.length + " taps)";
    lyric.classList.add("in");
    await sleep(400);
    await new Promise(res => {
        const h = () => {
            if (!marks.length) {
                lyric.style.direction = "rtl";
                lyric.style.fontFamily = "";
            }
            marks.push(+nowT().toFixed(1));
            const k = marks.length - 1;
            lyric.classList.remove("in");
            lyric.textContent = LYRIC_LINES[LYRIC_CUES[k][0]];
            void lyric.offsetWidth;
            lyric.classList.add("in");
            if (marks.length === LYRIC_CUES.length) {
                document.removeEventListener("pointerdown", h);
                res();
            }
        };
        document.addEventListener("pointerdown", h);
    });
    await sleep(2500);
    lyric.style.direction = "ltr";
    lyric.style.fontFamily = "var(--serif)";
    lyric.textContent = "Times: " + marks.join(", ");
    console.log("LYRIC TIMES:", JSON.stringify(marks));
}

$("#fsStart").onclick = async () => {
    const btn = $("#fsStart");
    const lyric = $("#fsLyric");

    btn.disabled = true;

    // start audio inside the click so browsers allow it
    pauseAll(finalAudio);
    finalAudio.currentTime = 0;
    finalAudio.volume = 1;
    try {
        await finalAudio.play();
    } catch (err) {
        console.error("Song could not play:", err, FINAL_SONG.src);
        useTimer = true;
        t0 = performance.now();
        alert("The song could not be played. Check that assets/songs/alfaz.mp3 is next to index.html. The lyrics will still show.");
    }

    await hideEl(btn);

    if (SYNC_MODE) { await runSync(lyric); return; }

    for (let k = 0; k < LYRIC_CUES.length; k++) {
        const [li, at] = LYRIC_CUES[k];
        await waitFor(at);

        lyric.textContent = LYRIC_LINES[li];
        void lyric.offsetWidth;
        lyric.classList.add("in");

        const next = k + 1 < LYRIC_CUES.length ? LYRIC_CUES[k + 1][1] : LYRIC_END;
        await waitFor(next - 0.7);
        lyric.classList.remove("in");
    }

    await waitFor(LYRIC_END);

    // fade the song out for the last ~1.5s, then continue to the letter scene
    for (let v = 1; v > 0; v -= 1 / 15) {
        finalAudio.volume = Math.max(0, v);
        await sleep(100);
    }
    finalAudio.pause();

    await sleep(1500);
    go("s7");
};
